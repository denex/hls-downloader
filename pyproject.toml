[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hls-downloader"
version = "1.0.1"
description = "Download all files as is from HLS VoD playlists."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Denis Averin", email = "ddenex@gmail.com" },
]
dependencies = [
    "m3u8>=3.5.0",
    "python-slugify>=8.0.4",
    "requests>=2.32.3",
]

[project.urls]
Homepage = "https://github.com/denex/hls-downloader"

[project.scripts]
hls-downloader = "hls_downloader.__main__:main"

[tool.setuptools.packages.find]
include = ["hls_downloader*"]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pyyaml>=6.0",
]
