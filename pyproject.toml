[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hls-downloader"
version = "0.1.0"
description = "Download HLS playlist assets for offline inspection."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "m3u8>=3.5.0",
    "python-slugify>=8.0.4",
    "requests>=2.32.3",
]

[project.scripts]
hls-downloader = "main:main"

[tool.setuptools]
py-modules = ["main", "downloader", "session"]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]
